<section class="stats" aria-label="Números da plataforma">
  <div class="stats__container">
    @for (stat of stats; track stat.label) {
      <div class="stat-card">
        <div class="stat-icon">
          <span class="material-symbols-outlined filled" aria-hidden="true">{{ stat.icon }}</span>
        </div>
        <div class="stat-info">
          <span class="stat-value">{{ stat.value }}</span>
          <span class="stat-label">{{ stat.label }}</span>
        </div>
      </div>
    }
  </div>
</section>
