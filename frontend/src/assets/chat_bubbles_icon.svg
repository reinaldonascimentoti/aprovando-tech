<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8b5cf6" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#bgGrad)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#bgGrad)" transform="rotate(45 60 60)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#glass)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#glass)" transform="rotate(45 60 60)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" transform="rotate(45 60 60)" />
    
    <!-- Bubble 2 (Background) -->
    <path d="M55 45 H75 C80 45 85 50 85 55 V65 C85 70 80 75 75 75 H68 L60 80 V75 H55 C50 75 45 70 45 65 V55 C45 50 50 45 55 45 Z" fill="#ffffff" opacity="0.6"/>
    
    <!-- Bubble 1 (Foreground) -->
    <path d="M40 35 H60 C65 35 70 40 70 45 V55 C70 60 65 65 60 65 H52 L45 70 V65 H40 C35 65 30 60 30 55 V45 C30 40 35 35 40 35 Z" fill="#ffffff" filter="url(#glow)"/>
    <path d="M40 35 H60 C65 35 70 40 70 45 V55 C70 60 65 65 60 65 H52 L45 70 V65 H40 C35 65 30 60 30 55 V45 C30 40 35 35 40 35 Z" fill="#ffffff" />
    
    <!-- Dots -->
    <circle cx="42" cy="50" r="2.5" fill="url(#bgGrad)" />
    <circle cx="50" cy="50" r="2.5" fill="url(#bgGrad)" />
    <circle cx="58" cy="50" r="2.5" fill="url(#bgGrad)" />
  </g>
</svg>
