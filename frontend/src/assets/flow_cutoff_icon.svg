<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cutoffBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="cutoffGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="120" height="120" rx="30" fill="url(#cutoffBgGrad)" />
  <rect width="120" height="120" rx="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />

  <!-- Speedometer / Meter Graphic -->
  <g filter="url(#cutoffGlow)">
    <!-- Base track -->
    <path d="M25 72 A 38 38 0 0 1 95 72" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="12" stroke-linecap="round" />
    <!-- Active Green track -->
    <path d="M25 72 A 38 38 0 0 1 85 38" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

    <!-- Needle -->
    <path d="M60 72 L82 38" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    <circle cx="60" cy="72" r="8" fill="#ffffff" />
    <circle cx="60" cy="72" r="4" fill="#047857" />

    <!-- Base bar -->
    <rect x="20" y="72" width="80" height="10" rx="5" fill="#ffffff" />

    <text x="60" y="98" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="15" text-anchor="middle">80%+</text>
  </g>
</svg>
