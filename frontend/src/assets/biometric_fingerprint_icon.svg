<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Project primary gradient -->
    <linearGradient id="projectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#433fe5" />
      <stop offset="100%" stop-color="#6b38d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid background covering everything, no borders -->
  <rect width="120" height="120" rx="30" fill="url(#projectGrad)" />

  <!-- Huge Fingerprint Icon centered -->
  <g transform="translate(60, 60) scale(1.8)" filter="url(#glow)">
    <path d="M 0 -8 C 4 -8 7 -5 7 -1 C 7 3 3 7 0 7 C -3 7 -7 3 -7 -1 C -7 -5 -4 -8 0 -8 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -13 0 C -13 -7 -7 -14 0 -14 C 7 -14 13 -7 13 0 V 8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -18 3 C -18 -6 -10 -20 0 -20 C 10 -20 18 -6 18 3 V 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -23 6 C -23 -11 -12 -25 0 -25 C 12 -25 23 -11 23 6 V 14" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -8 13 C -3 16 3 16 8 13" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -15 16 C -6 20 6 20 15 16" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
