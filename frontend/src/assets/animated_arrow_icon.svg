<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5d3bf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <g>
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="-3,0; 3,0; -3,0" 
      dur="1.4s" 
      repeatCount="indefinite" />

    <!-- Smooth animated chevrons -->
    <path d="M6 6 L16 16 L6 26" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4" />
    <path d="M15 6 L25 16 L15 26" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
