<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Highlight Gradient (Glass effect) -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3b82f6" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Base Shape (Overlapping squircles) -->
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#bgGrad)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#bgGrad)" transform="rotate(45 60 60)" />
    
    <!-- Glass Highlight Overlays -->
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#glass)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#glass)" transform="rotate(45 60 60)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" transform="rotate(45 60 60)" />
    
    <!-- Central Cloud Background (Glassy) -->
    <path d="M78 62 a12 12 0 0 0 -22 -6 a16 16 0 0 0 -30 6 a10 10 0 0 0 10 10 h40 a10 10 0 0 0 2 -10 z" fill="#ffffff" filter="url(#glow)"/>
    <path d="M78 62 a12 12 0 0 0 -22 -6 a16 16 0 0 0 -30 6 a10 10 0 0 0 10 10 h40 a10 10 0 0 0 2 -10 z" fill="#ffffff" />
    <path d="M78 62 a12 12 0 0 0 -22 -6 a16 16 0 0 0 -30 6 a10 10 0 0 0 10 10 h40 a10 10 0 0 0 2 -10 z" fill="none" stroke="url(#bgGrad)" stroke-width="2" opacity="0.3"/>
    
    <!-- Upload Arrow -->
    <path d="M60 70 v-22 M52 56 l8 -8 l8 8" fill="none" stroke="url(#bgGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
