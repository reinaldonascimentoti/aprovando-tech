<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="scheduleBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#433fe5" />
    </linearGradient>
    <filter id="scheduleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="120" height="120" rx="30" fill="url(#scheduleBgGrad)" />
  <rect width="120" height="120" rx="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />

  <!-- Calendar Card & Clock Overlay Graphic -->
  <g filter="url(#scheduleGlow)">
    <!-- Calendar Body -->
    <rect x="22" y="24" width="62" height="66" rx="10" fill="#ffffff" />
    <path d="M22 34 C22 28 25 24 32 24 H74 C81 24 84 28 84 34 V40 H22 V34 Z" fill="#6366f1" />
    <circle cx="38" cy="20" r="4" fill="#ffffff" />
    <circle cx="68" cy="20" r="4" fill="#ffffff" />

    <!-- Calendar grid dots -->
    <rect x="32" y="48" width="10" height="10" rx="3" fill="#3b82f6" />
    <rect x="48" y="48" width="10" height="10" rx="3" fill="#e2e8f0" />
    <rect x="64" y="48" width="10" height="10" rx="3" fill="#3b82f6" />
    <rect x="32" y="64" width="10" height="10" rx="3" fill="#10b981" />
    <rect x="48" y="64" width="10" height="10" rx="3" fill="#f59e0b" />

    <!-- Clock Badge Overlay -->
    <circle cx="82" cy="74" r="18" fill="#ffffff" stroke="#f59e0b" stroke-width="4" />
    <path d="M82 64 V74 L89 79" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
