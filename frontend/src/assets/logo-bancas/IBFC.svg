<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <style>
      .blue-brand { 
        fill: #004b61; 
      }
      .yellow-brand { 
        fill: #ffd100; 
      }
      .text-inst {
        font-family: 'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: 15.5px;
        font-weight: 800;
        fill: #004b61;
        font-stretch: condensed;
      }
    </style>
  </defs>
  
  <g transform="translate(5, 5)">
    <!-- Ponto amarelo do 'i' -->
    <circle cx="35" cy="28" r="18" class="yellow-brand"/>
    
    <!-- Letra 'i' -->
    <path d="M 12 35 Q 25 65 50 65 L 85 65 L 85 145 L 50 145 L 50 65 Q 25 65 12 35 Z" class="blue-brand"/>
    
    <!-- Letra 'b' -->
    <!-- Desenhada mantendo a espessura da haste e das curvas matematicamente proporcionais -->
    <path d="M 95 20 L 130 20 L 130 65 C 170 65 195 80 195 105 C 195 135 170 145 130 145 L 95 145 Z M 130 90 L 130 120 C 150 120 160 115 160 105 C 160 95 150 90 130 90 Z" class="blue-brand"/>
    
    <!-- Letra 'f' -->
    <path d="M 255 20 C 225 20 210 35 210 65 L 210 80 L 195 80 L 195 105 L 210 105 L 210 145 L 245 145 L 245 105 L 265 105 L 265 80 L 245 80 L 245 65 C 245 55 250 50 260 50 L 270 50 L 270 20 Z" class="blue-brand"/>
    
    <!-- Letra 'c' (formato de lua crescente/gancho) -->
    <path d="M 345 60 C 300 55 270 80 270 110 C 270 140 300 155 345 145 C 360 142 375 130 385 115 C 370 130 350 135 330 130 C 310 125 305 100 320 85 C 330 75 345 75 360 80 L 370 55 C 360 55 350 60 345 60 Z" class="blue-brand"/>
    
    <!-- Linha Amarela Base -->
    <rect x="10" y="160" width="375" height="8" rx="4" class="yellow-brand"/>
    
    <!-- Texto Inferior -->
    <!-- Utilizando textLength para forçar o alinhamento justificado exato do texto sob as letras e a linha -->
    <text x="10" y="188" class="text-inst" textLength="375" lengthAdjust="spacingAndGlyphs">INSTITUTO BRASILEIRO DE FORMAÇÃO E CAPACITAÇÃO</text>
  </g>
</svg>
