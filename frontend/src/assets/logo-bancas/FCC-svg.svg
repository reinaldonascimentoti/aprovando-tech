<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180" width="100%" height="100%">
  <defs>
    <style>
      .logo-text {
        font-family: 'Century Gothic', 'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        fill: #3e4a52;
        font-size: 52px;
        letter-spacing: -0.5px;
      }
      .fcc-red {
        fill: #a60a31;
      }
    </style>
  </defs>
  
  <!-- Símbolo FCC -->
  <g transform="translate(10, 20)">
    <!-- Haste Vertical -->
    <path class="fcc-red" d="M35 0 L49 0 L49 140 L35 140 Z"/>
    
    <!-- Traço Superior (C) -->
    <path class="fcc-red" d="M2 32 C 30 20, 80 15, 110 25 C 135 34, 135 55, 115 65 C 105 70, 90 70, 80 65 C 95 62, 105 52, 95 40 C 85 28, 40 33, 2 45 Z" />
    
    <!-- Traço Inferior (C) -->
    <path class="fcc-red" d="M2 82 C 30 70, 80 65, 110 75 C 135 84, 135 105, 115 115 C 105 120, 90 120, 80 115 C 95 112, 105 102, 95 90 C 85 78, 40 83, 2 95 Z" />
  </g>
  
  <!-- Tipografia -->
  <text x="180" y="75" class="logo-text">Fundação</text>
  <text x="120" y="130" class="logo-text">Carlos Chagas</text>
</svg>
