<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Ouro (Tochas, Fita Traseira) -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c6705"/>
      <stop offset="25%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#e89f13"/>
      <stop offset="75%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#734a02"/>
    </linearGradient>

    <!-- Gradiente do Sol -->
    <radialGradient id="sun-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffeb59"/>
      <stop offset="50%" stop-color="#f5a402"/>
      <stop offset="100%" stop-color="#cc6600"/>
    </radialGradient>

    <!-- Gradiente da Fita Azul -->
    <linearGradient id="ribbon-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241e8c"/>
      <stop offset="50%" stop-color="#14115e"/>
      <stop offset="100%" stop-color="#090736"/>
    </linearGradient>

    <!-- Padrão Heráldico Floral do Escudo -->
    <pattern id="fleur" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <!-- Losangos dos cantos -->
      <polygon points="0,0 4,0 0,4" fill="#da251d" />
      <polygon points="36,0 36,4 32,0" fill="#da251d" />
      <polygon points="0,36 0,32 4,36" fill="#da251d" />
      <polygon points="36,36 36,32 32,36" fill="#da251d" />
      <!-- Flor Central -->
      <g fill="#da251d">
        <path d="M 18 4 C 24 10, 26 14, 18 16 C 10 14, 12 10, 18 4 Z"/>
        <path d="M 18 32 C 24 26, 26 22, 18 20 C 10 22, 12 26, 18 32 Z"/>
        <path d="M 4 18 C 10 12, 14 10, 16 18 C 14 26, 10 24, 4 18 Z"/>
        <path d="M 32 18 C 26 12, 22 10, 20 18 C 22 26, 26 24, 32 18 Z"/>
        <circle cx="18" cy="18" r="2.5" fill="white"/>
      </g>
    </pattern>

    <!-- Máscara do Escudo -->
    <clipPath id="shield-clip">
      <path d="M 185 200 L 415 200 L 415 410 C 415 460, 340 480, 300 480 C 260 480, 185 460, 185 410 Z" />
    </clipPath>

    <!-- Caminho Base do Escudo -->
    <path id="shield-path" d="M 185 200 L 415 200 L 415 410 C 415 460, 340 480, 300 480 C 260 480, 185 460, 185 410 Z" />

    <!-- Caminho Curvo para o Texto da Fita -->
    <path id="ribbon-text-path" d="M 160 450 Q 300 498 440 450" fill="none" />

    <!-- Estrutura de uma Única Tocha (Repetida 3x) -->
    <g id="torch">
      <!-- Haste -->
      <rect x="-8" y="-40" width="16" height="380" fill="url(#gold)" stroke="#222" stroke-width="1"/>
      <!-- Sombreado Cilíndrico da Haste -->
      <line x1="-4" y1="-40" x2="-4" y2="340" stroke="#9c6705" stroke-width="1.5"/>
      <line x1="4" y1="-40" x2="4" y2="340" stroke="#ffeb85" stroke-width="1.5"/>
      
      <!-- Topo (Copo) -->
      <path d="M -12 -40 L 12 -40 C 12 -30, -12 -30, -12 -40 Z" fill="url(#gold)" stroke="#222" stroke-width="1"/>
      <path d="M -15 -40 L 15 -40 L 18 -55 C 18 -60, -18 -60, -18 -55 Z" fill="url(#gold)" stroke="#222" stroke-width="1"/>
      <rect x="-20" y="-62" width="40" height="6" rx="3" fill="url(#gold)" stroke="#222" stroke-width="1"/>
      <path d="M -15 -62 L 15 -62 L 18 -75 C 18 -80, -18 -80, -18 -75 Z" fill="url(#gold)" stroke="#222" stroke-width="1"/>
      
      <!-- Base (Ornamento Inferior) -->
      <rect x="-12" y="340" width="24" height="6" rx="2" fill="url(#gold)" stroke="#222" stroke-width="1"/>
      <path d="M -8 346 L 8 346 C 8 366, 0 380, 0 380 C 0 380, -8 366, -8 346 Z" fill="url(#gold)" stroke="#222" stroke-width="1"/>
      
      <!-- Chamas Heráldicas -->
      <g stroke="#222" stroke-width="0.5">
        <path d="M -14 -75 C -25 -100 -25 -130 -10 -150 C -15 -130 -5 -100 -2 -75 Z" fill="#1b326b"/>
        <path d="M -8 -75 C -15 -105 -15 -130 5 -160 C -5 -130 2 -100 4 -75 Z" fill="#da251d"/>
        <path d="M 0 -75 C -5 -110 5 -150 20 -170 C 5 -140 10 -100 12 -75 Z" fill="#da251d"/>
        <path d="M -2 -75 C 0 -100 8 -130 15 -150 C 5 -125 8 -95 6 -75 Z" fill="#fcd34d"/>
        <path d="M 8 -75 C 10 -100 20 -130 30 -150 C 15 -120 15 -100 16 -75 Z" fill="#1b326b"/>
        <path d="M 14 -75 C 20 -95 30 -120 40 -135 C 25 -110 22 -95 20 -75 Z" fill="#da251d"/>
      </g>
    </g>
  </defs>

  <!-- 3 Tochas Traseiras -->
  <use href="#torch" x="225" y="230" />
  <use href="#torch" x="300" y="230" />
  <use href="#torch" x="375" y="230" />

  <!-- Escudo -->
  <g id="shield-group">
    <!-- Fundo Branco -->
    <use href="#shield-path" fill="#ffffff" />
    <!-- Textura Floral Vermelha -->
    <use href="#shield-path" fill="url(#fleur)" />
    
    <!-- Faixa Diagonal Azul Escura -->
    <line x1="160" y1="180" x2="440" y2="460" stroke="#1d1670" stroke-width="110" clip-path="url(#shield-clip)"/>
    
    <!-- Sol Dourado -->
    <g transform="translate(250, 270)">
      <!-- Raios Exteriores (Criados com tracejado circular exato) -->
      <circle cx="0" cy="0" r="33" fill="none" stroke="#e89f13" stroke-width="8" stroke-dasharray="5 5.36" />
      <!-- Corpo do Sol -->
      <circle cx="0" cy="0" r="28" fill="url(#sun-grad)" stroke="#b86904" stroke-width="1.5" />
    </g>

    <!-- Borda do Escudo -->
    <use href="#shield-path" fill="none" stroke="#222" stroke-width="2" />
  </g>

  <!-- Fita Inferior -->
  <g id="ribbon">
    <!-- Partes Traseiras (Dobras Ouro) -->
    <path d="M 145 420 C 130 415, 120 430, 130 450 C 140 460, 155 465, 175 455 Z" fill="url(#gold)" stroke="#222"/>
    <path d="M 455 420 C 470 415, 480 430, 470 450 C 460 460, 445 465, 425 455 Z" fill="url(#gold)" stroke="#222"/>
    
    <!-- Corpo Central Azul -->
    <path d="M 140 425 Q 300 480 460 425 L 440 465 Q 300 510 160 465 Z" fill="url(#ribbon-blue)" stroke="#222" stroke-width="1.5"/>
    
    <!-- Texto da Fita -->
    <text fill="#ffeb00" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" letter-spacing="2">
      <textPath href="#ribbon-text-path" startOffset="50%" text-anchor="middle">LUMEN AD VIAM</textPath>
    </text>
  </g>

  <!-- Tipografia Principal (Nome da Universidade) -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#222" text-anchor="middle">
    <!-- Primeira Linha -->
    <text x="300" y="585" letter-spacing="1">
      <tspan font-size="60">U</tspan><tspan font-size="46">NIVERSIDADE</tspan>
    </text>
    
    <!-- Segunda Linha -->
    <text x="300" y="650" letter-spacing="1">
      <tspan font-size="52">E</tspan><tspan font-size="40">STADUAL</tspan>
      <tspan font-size="40"> </tspan><tspan font-size="32">DO</tspan><tspan font-size="40"> </tspan>
      <tspan font-size="52">C</tspan><tspan font-size="40">EARÁ</tspan>
    </text>
  </g>
</svg>
