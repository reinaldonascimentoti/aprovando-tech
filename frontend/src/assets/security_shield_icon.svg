<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#059669" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#bgGrad)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#bgGrad)" transform="rotate(45 60 60)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#glass)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#glass)" transform="rotate(45 60 60)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" transform="rotate(45 60 60)" />
    
    <!-- Shield -->
    <path d="M60 35 L40 42 V58 C40 73 50 83 60 88 C70 83 80 73 80 58 V42 Z" fill="#ffffff" filter="url(#glow)"/>
    <path d="M60 35 L40 42 V58 C40 73 50 83 60 88 C70 83 80 73 80 58 V42 Z" fill="#ffffff" />
    <path d="M60 35 L40 42 V58 C40 73 50 83 60 88 C70 83 80 73 80 58 V42 Z" fill="none" stroke="url(#bgGrad)" stroke-width="2" opacity="0.3"/>
    
    <!-- Checkmark -->
    <path d="M50 62 L57 69 L72 52" fill="none" stroke="url(#bgGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
