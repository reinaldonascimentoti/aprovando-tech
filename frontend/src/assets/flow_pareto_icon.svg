<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="paretoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b38d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="paretoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="120" height="120" rx="30" fill="url(#paretoBgGrad)" />
  <rect width="120" height="120" rx="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />

  <!-- Donut Chart Graphic -->
  <g filter="url(#paretoGlow)">
    <!-- 80% White Ring Arc -->
    <circle cx="60" cy="60" r="34" stroke="#ffffff" stroke-width="18" fill="none" />
    <!-- 20% Amber Ring Arc -->
    <circle cx="60" cy="60" r="34" stroke="#fbbf24" stroke-width="18" fill="none" stroke-dasharray="213" stroke-dashoffset="43" transform="rotate(-90 60 60)" />
    
    <!-- Center Cutout -->
    <circle cx="60" cy="60" r="22" fill="#6b38d4" />

    <!-- Text 80 and 20 -->
    <text x="48" y="56" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="16">80</text>
    <text x="64" y="72" fill="#fbbf24" font-family="sans-serif" font-weight="900" font-size="14">20</text>
  </g>
</svg>
