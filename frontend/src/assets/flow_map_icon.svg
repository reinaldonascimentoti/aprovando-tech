<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="mapGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="120" height="120" rx="30" fill="url(#mapBgGrad)" />
  <rect width="120" height="120" rx="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />

  <!-- 4 Colored Grid Cards Graphic -->
  <g filter="url(#mapGlow)" transform="translate(18, 18)">
    <!-- Folder 1: Blue -->
    <rect x="0" y="0" width="38" height="38" rx="10" fill="#ffffff" />
    <rect x="6" y="6" width="26" height="10" rx="4" fill="#3b82f6" />
    <line x1="6" y1="22" x2="28" y2="22" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="6" y1="29" x2="20" y2="29" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <!-- Folder 2: Cyan -->
    <rect x="46" y="0" width="38" height="38" rx="10" fill="#ffffff" />
    <rect x="52" y="6" width="26" height="10" rx="4" fill="#06b6d4" />
    <line x1="52" y1="22" x2="74" y2="22" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="52" y1="29" x2="66" y2="29" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <!-- Folder 3: Pink -->
    <rect x="0" y="46" width="38" height="38" rx="10" fill="#ffffff" />
    <rect x="6" y="52" width="26" height="10" rx="4" fill="#ec4899" />
    <line x1="6" y1="68" x2="28" y2="68" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="6" y1="75" x2="20" y2="75" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <!-- Folder 4: Amber -->
    <rect x="46" y="46" width="38" height="38" rx="10" fill="#ffffff" />
    <rect x="52" y="52" width="26" height="10" rx="4" fill="#f59e0b" />
    <line x1="52" y1="68" x2="74" y2="68" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="52" y1="75" x2="66" y2="75" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
