<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="priorityBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="priorityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="120" height="120" rx="30" fill="url(#priorityBgGrad)" />
  <rect width="120" height="120" rx="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />

  <!-- Target & Badges Graphic -->
  <g filter="url(#priorityGlow)" transform="translate(0, 0)">
    <!-- Bullseye Circles -->
    <circle cx="60" cy="60" r="38" fill="#ffffff" opacity="0.25" />
    <circle cx="60" cy="60" r="38" stroke="#ffffff" stroke-width="5" fill="none" />
    <circle cx="60" cy="60" r="25" stroke="#ffffff" stroke-width="4" fill="none" />
    <circle cx="60" cy="60" r="12" fill="#ffffff" />

    <!-- Badges 3, A, B -->
    <circle cx="60" cy="32" r="10" fill="#dc2626" />
    <text x="60" y="37" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">3</text>

    <circle cx="38" cy="72" r="10" fill="#2563eb" />
    <text x="38" y="77" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="13" text-anchor="middle">A</text>

    <circle cx="82" cy="74" r="10" fill="#10b981" />
    <text x="82" y="79" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="13" text-anchor="middle">B</text>
  </g>
</svg>
