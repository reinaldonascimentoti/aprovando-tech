<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#433fe5" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Inner Gradient -->
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#433fe5" />
    </linearGradient>

    <!-- Highlight Gradient (Glass effect) -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#433fe5" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Base Gear Shape (Overlapping squircles for a modern fluent gear) -->
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#bgGrad)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#bgGrad)" transform="rotate(45 60 60)" />
    
    <!-- Glass Highlight Overlays for the Gear -->
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#glass)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#glass)" transform="rotate(45 60 60)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" transform="rotate(45 60 60)" />
    
    <!-- Inner Dark Circle -->
    <circle cx="60" cy="60" r="28" fill="#1e1b4b" opacity="0.3" />
    <circle cx="60" cy="60" r="26" fill="url(#innerGrad)" />
    <circle cx="60" cy="60" r="26" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5" />
    
    <!-- Central AI Chip Background -->
    <rect x="45" y="45" width="30" height="30" rx="8" fill="#ffffff" filter="url(#glow)"/>
    <rect x="45" y="45" width="30" height="30" rx="8" fill="#ffffff" />
    
    <!-- Inner Chip Screen -->
    <rect x="48" y="48" width="24" height="24" rx="5" fill="url(#bgGrad)" />
    
    <!-- Circuit lines on chip -->
    <path d="M 45 54 h -5 M 45 60 h -5 M 45 66 h -5 M 75 54 h 5 M 75 60 h 5 M 75 66 h 5 M 54 45 v -5 M 60 45 v -5 M 66 45 v -5 M 54 75 v 5 M 60 75 v 5 M 66 75 v 5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    
    <!-- AI Text -->
    <text x="60" y="64.5" font-family="'Inter', 'Roboto', 'Segoe UI', sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">AI</text>
  </g>
</svg>
