<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3b82f6" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#bgGrad)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#bgGrad)" transform="rotate(45 60 60)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#glass)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="url(#glass)" transform="rotate(45 60 60)" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />
    <rect x="22" y="22" width="76" height="76" rx="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" transform="rotate(45 60 60)" />
    
    <!-- User 2 (Background) -->
    <circle cx="70" cy="48" r="8" fill="#ffffff" opacity="0.6"/>
    <path d="M56 75 C56 65 84 65 84 75" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    
    <!-- User 1 (Foreground) -->
    <circle cx="50" cy="45" r="10" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="50" cy="45" r="10" fill="#ffffff" />
    <path d="M34 78 C34 62 66 62 66 78" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M34 78 C34 62 66 62 66 78" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
