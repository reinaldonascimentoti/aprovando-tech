<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="alertsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="alertsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="120" height="120" rx="30" fill="url(#alertsBgGrad)" />
  <rect width="120" height="120" rx="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />

  <!-- Magnifying Glass & Warning Badges Graphic -->
  <g filter="url(#alertsGlow)">
    <!-- Magnifying lens -->
    <circle cx="50" cy="50" r="28" fill="#ffffff" opacity="0.95" />
    <circle cx="50" cy="50" r="28" fill="none" stroke="#ffffff" stroke-width="4" />
    <path d="M70 70 L94 94" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

    <!-- Circular Badges inside/around lens -->
    <circle cx="40" cy="40" r="8" fill="#ef4444" />
    <text x="40" y="45" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">!</text>

    <circle cx="60" cy="40" r="8" fill="#3b82f6" />
    <text x="60" y="45" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">?</text>

    <circle cx="40" cy="60" r="8" fill="#ec4899" />
    <text x="40" y="64.5" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">+</text>

    <circle cx="60" cy="60" r="8" fill="#10b981" />
    <text x="60" y="64.5" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle">✓</text>
  </g>
</svg>
