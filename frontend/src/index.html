<!DOCTYPE html>
<html lang="pt-BR" class="dark" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Aprovando Tech - IA & Pareto 80/20</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <!-- Google Fonts: Plus Jakarta Sans & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN for utility grid layout -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('aprovando-theme');
        var isDark = stored ? stored === 'dark' : true;
        if (isDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>
<body class="bg-[var(--background)] text-[var(--on-surface)] transition-colors duration-300">
  <app-root></app-root>
</body>
</html>
