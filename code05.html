<style>
        body {
            background-color: #f7f9fc;
            overflow: hidden;
        }

        /* Neomorphic Raised */
        .neo-raised {
            background: #f7f9fc;
            box-shadow: 8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff;
        }

        /* Neomorphic Pressed */
        .neo-pressed {
            background: #f7f9fc;
            box-shadow: inset 6px 6px 12px #d1d9e6, inset -6px -6px 12px #ffffff;
        }

        /* Mesh Gradient Button */
        .btn-mesh {
            background: linear-gradient(135deg, #433fe5 0%, #6b38d4 50%, #8455ef 100%);
            box-shadow: 4px 4px 10px rgba(107, 56, 212, 0.3), -4px -4px 10px rgba(255, 255, 255, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-mesh:hover {
            transform: translateY(-2px);
            box-shadow: 0px 0px 20px rgba(107, 56, 212, 0.5);
        }

        .btn-mesh:active {
            transform: scale(0.96);
        }

        /* Active Glow */
        .active-glow {
            box-shadow: 0 0 15px rgba(107, 56, 212, 0.4);
        }

        /* Custom Transition */
        .toggle-transition {
            transition: all 0.3s ease;
        }

<body class="font-body-md text-on-surface">
<!-- Global Background Animation -->
<main class="min-h-screen flex items-center justify-center p-md relative z-10">
<!-- Login Card -->
<div class="neo-raised w-full max-w-[440px] rounded-[32px] p-xl flex flex-col items-center">

<input class="neo-pressed w-full h-14 pl-12 pr-4 rounded-2xl border-none focus:ring-2 focus:ring-primary/20 bg-transparent text-body-lg placeholder:text-outline-variant outline-none" placeholder="alex.rivers@university.edu" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-2">
<label class="font-label-sm text-on-surface-variant">Senha</label>
<a class="font-label-sm text-primary hover:underline" href="#">Esqueceu?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="neo-pressed w-full h-14 pl-12 pr-4 rounded-2xl border-none focus:ring-2 focus:ring-primary/20 bg-transparent text-body-lg placeholder:text-outline-variant outline-none" placeholder="••••••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->

<span class="font-body-md text-on-surface-variant select-none">Confiar neste dispositivo por 30 dias</span>
</div>

</main>
<script>
        function toggleRole(role) {
            const bg = document.getElementById('toggle-bg');
            const btnStudent = document.getElementById('btn-student');
            const btnAdmin = document.getElementById('btn-admin');

            if (role === 'student') {
                bg.style.left = '6px';
                btnStudent.classList.add('text-primary');
                btnStudent.classList.remove('text-on-surface-variant');
                btnAdmin.classList.remove('text-primary');
                btnAdmin.classList.add('text-on-surface-variant');
            } else {
                bg.style.left = 'calc(50%)';
                btnAdmin.classList.add('text-primary');
                btnAdmin.classList.remove('text-on-surface-variant');
                btnStudent.classList.remove('text-primary');
                btnStudent.classList.add('text-on-surface-variant');
            }
        }

        // Add subtle neomorphic hover effect to inputs via JS for better control
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('active-glow');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('active-glow');
            });
        });
    </script>
