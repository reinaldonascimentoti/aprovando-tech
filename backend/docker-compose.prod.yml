services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aprovando_backend_prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aprovando_prod_network

  redis:
    image: redis:7-alpine
    container_name: aprovando_redis_prod
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aprovando_prod_network

networks:
  aprovando_prod_network:
    driver: bridge

volumes:
  redis_prod_data:
    driver: local
