services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: aprovando_backend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./src:/usr/src/app/src
      - ./package.json:/usr/src/app/package.json
      - /usr/src/app/node_modules
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - aprovando_dev_network

  redis:
    image: redis:7-alpine
    container_name: aprovando_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - aprovando_dev_network

networks:
  aprovando_dev_network:
    driver: bridge

volumes:
  redis_dev_data:
    driver: local
